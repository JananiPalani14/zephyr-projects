# ---------------------------------------------------------
# Bluetooth
# ---------------------------------------------------------

CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=y

CONFIG_BT_DEVICE_NAME="ASSET_RELAY_01"

# ---------------------------------------------------------
# Bluetooth Mesh
# ---------------------------------------------------------

CONFIG_BT_MESH=y

CONFIG_BT_MESH_RELAY=y
CONFIG_BT_MESH_RELAY_ENABLED=y

CONFIG_BT_MESH_PB_ADV=y
CONFIG_BT_MESH_PB_GATT=y

CONFIG_BT_MESH_GATT_PROXY=y

# One Mesh network and one application key for this POC
CONFIG_BT_MESH_SUBNET_COUNT=1
CONFIG_BT_MESH_APP_KEY_COUNT=1
CONFIG_BT_MESH_MODEL_KEY_COUNT=1
CONFIG_BT_MESH_MODEL_GROUP_COUNT=1

# ---------------------------------------------------------
# Mesh persistent storage
# ---------------------------------------------------------

CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# ---------------------------------------------------------
# Application
# ---------------------------------------------------------

CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_LOG=y
CONFIG_BT_MESH_LOG_LEVEL_DBG=y

CONFIG_BT_MESH_PROV_LOG_LEVEL_DBG=y
CONFIG_BT_MESH_PROVISIONEE_LOG_LEVEL_DBG=y
